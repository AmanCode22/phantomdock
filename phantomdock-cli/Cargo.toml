[package]
name = "phantomdock-cli"
version = "0.1.0"
edition = "2021"
description = "PhantomDock daemon (pdock) — hardened localhost bridge for agentic web-AI automation"
license = "MIT"
repository = "https://github.com/AmanCode22/phantomdock"
authors = ["AmanCode22 <amanady125@gmail.com>"]

[lib]
name = "phantomdock_cli"
path = "src/lib.rs"

[[bin]]
name = "pdock"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
regex = "1"
glob = "0.3"
futures = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.24"
